name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 运行 guard.py 的 12 个单测
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  repro:
    name: AP2 复现脚本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 检出固定 commit 的 AP2 SDK
        uses: actions/checkout@v4
        with:
          repository: google-agentic-commerce/AP2
          ref: e1ea56db72a6385bce3e5c1112b3a56ce60acb43
          path: AP2
      - name: 安装复现依赖
        run: pip install --disable-pip-version-check -r repro/requirements.txt
      - name: 运行复现脚本
        env:
          PYTHONPATH: AP2/code/sdk/python
        run: |
          python repro/repro_395.py
          python repro/repro_more.py
